# Private GitLab is authoritative. GitHub only provides public verification.
stages: [qa, package, publish]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.Build/composer-cache"
  COMPOSER_ALLOW_SUPERUSER: "1"
  GIT_DEPTH: "0"

.php:
  image: "php:${PHP_VERSION}-cli-bookworm"
  variables:
    PHP_VERSION: "8.4"
  cache:
    key: "composer-php-${PHP_VERSION}"
    paths: [.Build/composer-cache/]
  before_script:
    - bash Build/ci-setup.sh
    - composer install --no-interaction --prefer-dist --no-progress

qa:
  extends: .php
  stage: qa
  parallel:
    matrix:
      - PHP_VERSION: ["8.2", "8.4"]
  script:
    - composer validate
    - composer php-lint
    - composer test
    - composer phpstan
    - composer typoscript-lint
    - .Build/bin/typo3 list -vvv
    - .Build/bin/typo3 asset:publish -vvv

style:
  extends: .php
  stage: qa
  script:
    - composer cs-check
  # Existing formatting debt is visible; tool/configuration failures still block.
  allow_failure:
    exit_codes: [8]

package:
  extends: .php
  stage: package
  script:
    - bash build-release.sh "${CI_COMMIT_TAG#v}"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.+-]+)?$/'
  artifacts:
    paths: [dist/*.zip, dist/*.sha256]
    expire_in: 30 days

publish-composer:
  image: curlimages/curl:latest
  stage: publish
  needs: [package]
  script:
    - 'curl --fail-with-body --header "Job-Token: $CI_JOB_TOKEN" --data-urlencode "tag=$CI_COMMIT_TAG" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/composer"'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.+-]+)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'

publish-github:
  image: debian:bookworm-slim
  stage: publish
  needs:
    - job: package
      artifacts: true
    - job: publish-composer
      artifacts: false
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends ca-certificates git gh
  script:
    - bash Build/publish-github.sh
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.+-]+)?$/ && $CI_COMMIT_REF_PROTECTED == "true" && $PUBLIC_RELEASE_ENABLED == "true"'
      when: manual
  allow_failure: false
