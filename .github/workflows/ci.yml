name: Public verification

on:
  pull_request:
  push:
    branches: [v14]

permissions:
  contents: read

jobs:
  verify:
    # Private GitLab owns the full matrix, packaging and publication.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, zip, gd
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate
      - run: composer php-lint
      - run: composer test
      - run: composer phpstan
      - run: composer typoscript-lint
