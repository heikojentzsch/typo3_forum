# TYPO3 Forum DDEV managed site
base: '__BASE_URL__/'
rootPageId: __ROOT_PAGE_UID__
websiteTitle: 'TYPO3 Forum development'
languages:
  - title: Deutsch
    enabled: true
    languageId: 0
    base: /
    locale: de_DE.UTF-8
    navigationTitle: Deutsch
    hreflang: de-DE
    flag: de
imports:
  - resource: 'EXT:typo3_forum/Configuration/Routing/Routing.yaml'
errorHandling:
  - errorCode: 403
    errorHandler: LoginRedirect
    loginRedirectTarget: 't3://page?uid=__LOGIN_PAGE_UID__'
    loginRedirectParameter: redirect_url
