{namespace mmf=Mittwald\Typo3Forum\ViewHelpers}

<div class="tx-typo3forum-action-menu {f:if(condition: '{forum.parent}', then: 'mb-3')}">
	<mmf:authentication.ifAccess object="{forum}" accessType="newTopic">
		<f:link.action controller="Topic" action="new" class="btn btn-primary me-1 mb-1" arguments="{forum: forum}">
			<i class="fas fa-plus me-1"></i> {f:translate(key:'Button_Topic_New')}
		</f:link.action>
	</mmf:authentication.ifAccess>

	<mmf:authentication.ifLoggedIn>
		<mmf:user.ifSubscribed object="{forum}">
			<f:then>
				<f:form controller="User" action="subscribe" arguments="{forum: forum.uid, unsubscribe: 1}" method="post" requestToken="typo3_forum/mutation" class="d-inline"><button type="submit" class="btn btn-primary me-1 mb-1">
					<i class="fas fa-bell-slash me-1"></i> {f:translate(key:'Button_Unsubscribe')}
				</button></f:form>
			</f:then>
			<f:else>
				<f:form controller="User" action="subscribe" arguments="{forum: forum.uid, unsubscribe: 0}" method="post" requestToken="typo3_forum/mutation" class="d-inline"><button type="submit" class="btn btn-primary me-1 mb-1">
					<i class="fas fa-bell me-1"></i> {f:translate(key:'Button_Subscribe')}
				</button></f:form>
			</f:else>
		</mmf:user.ifSubscribed>

		<f:if condition="!{forum.beenReadByCurrentUser}">
			<f:form controller="Forum" action="markRead" arguments="{forum: forum.uid}" method="post" requestToken="typo3_forum/mutation" class="d-inline"><button type="submit" class="btn btn-primary me-1 mb-1">
				<i class="fas fa-eye me-1"></i> {f:translate(key:'Button_Mark_Read')}
			</button></f:form>
		</f:if>
	</mmf:authentication.ifLoggedIn>
</div>

<f:if condition="{forum.parent}">
	<f:then>
		<f:link.action controller="Forum" action="show" class="btn btn-info" arguments="{forum: forum.parent}">
			<i class="fas fa-chevron-left me-1"></i>
			<f:translate key="Button_Back" />
		</f:link.action>
	</f:then>
</f:if>
