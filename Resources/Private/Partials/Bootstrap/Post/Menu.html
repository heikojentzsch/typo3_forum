{namespace mmf=Mittwald\Typo3Forum\ViewHelpers}

<ul class="nav nav-pills tx-typo3forum-post-menu">
	<mmf:authentication.ifLoggedIn>
		<li class="nav-item">
			<mmf:user.isCurrentUser user="{post.author}">
				<f:then>
					<span class="tx-typo3forum-post-menu-action disabled" title="{f:translate(key: 'Button_Support_Self')}">
						<i class="fas fa-heart" aria-hidden="true"></i>
						<f:translate key="Button_Like" /> ({post.helpfulCount})
					</span>
				</f:then>
				<f:else>
					<mmf:post.ifSupports post="{post}">
						<f:then>
							<f:link.action pageUid="{settings.pids.Forum}" controller="Post" pluginName="Forum" action="unsupport" arguments="{post: post}" class="tx-typo3forum-post-menu-action" title="{f:translate(key: 'Button_Unsupport')}">
								<i class="fas fa-heart" aria-hidden="true"></i>
								<f:translate key="Button_Like" /> ({post.helpfulCount})
							</f:link.action>
						</f:then>
						<f:else>
							<f:link.action pageUid="{settings.pids.Forum}" controller="Post" pluginName="Forum" action="support" arguments="{post: post}" class="tx-typo3forum-post-menu-action" title="{f:translate(key: 'Button_Support')}">
								<i class="far fa-heart" aria-hidden="true"></i>
								<f:translate key="Button_Like" /> ({post.helpfulCount})
							</f:link.action>
						</f:else>
					</mmf:post.ifSupports>
				</f:else>
			</mmf:user.isCurrentUser>
		</li>
	</mmf:authentication.ifLoggedIn>

	<mmf:authentication.ifAccess object="{post.topic}" accessType="newPost">
		<li class="nav-item">
			<f:link.action pageUid="{settings.pids.Forum}" pluginName="Forum" controller="Post" action="new" arguments="{topic: post.topic, quote: post}" class="tx-typo3forum-post-menu-action" title="{f:translate(key: 'Button_Quote')}">
				<i class="fas fa-quote-right" aria-hidden="true"></i>
				<f:translate key="Button_Quote" />
			</f:link.action>
		</li>
	</mmf:authentication.ifAccess>

	<mmf:authentication.ifLoggedIn>
		<li class="nav-item">
			<f:link.action pageUid="{settings.pids.Forum}" pluginName="Forum" controller="Report" action="newPostReport" arguments="{post: post}" class="tx-typo3forum-post-menu-action" title="{f:translate(key: 'Button_Report')}">
				<i class="fas fa-exclamation-triangle" aria-hidden="true"></i>
				<f:translate key="Button_Report" />
			</f:link.action>
		</li>
	</mmf:authentication.ifLoggedIn>

	<mmf:authentication.ifAccess object="{post}" accessType="editPost">
		<li class="nav-item">
			<f:link.action pageUid="{settings.pids.Forum}" pluginName="Forum" controller="Post" action="edit" arguments="{post: post}" class="tx-typo3forum-post-menu-action" title="{f:translate(key: 'Button_Edit')}">
				<i class="fas fa-edit" aria-hidden="true"></i>
				<f:translate key="Button_Edit" />
			</f:link.action>
		</li>
	</mmf:authentication.ifAccess>

	<mmf:authentication.ifAccess object="{post}" accessType="deletePost">
		<li class="nav-item">
			<f:link.action pageUid="{settings.pids.Forum}" pluginName="Forum" controller="Post" action="confirmDelete" arguments="{post: post}" class="tx-typo3forum-post-menu-action" title="{f:translate(key: 'Button_Delete')}">
				<i class="fas fa-trash-alt" aria-hidden="true"></i>
				<f:translate key="Button_Delete" />
			</f:link.action>
		</li>
	</mmf:authentication.ifAccess>

	<mmf:post.ifCanMarkSolution post="{post}">
		<li class="nav-item">
			<f:if condition="{post.solution}">
				<f:then>
					<f:link.action pageUid="{settings.pids.Forum}" pluginName="Forum" controller="Topic" action="removeSolution" arguments="{topic: post.topic}" class="tx-typo3forum-post-menu-action" title="{f:translate(key: 'Button_RemoveSolution')}">
						<i class="far fa-square-minus" aria-hidden="true"></i>
						<f:translate key="Button_RemoveSolution" />
					</f:link.action>
				</f:then>
				<f:else>
					<f:link.action pageUid="{settings.pids.Forum}" pluginName="Forum" controller="Topic" action="solution" arguments="{post: post}" class="tx-typo3forum-post-menu-action" title="{f:translate(key: 'Button_Solution')}">
						<i class="fas fa-square-check" aria-hidden="true"></i>
						<f:translate key="Button_Solution" />
					</f:link.action>
				</f:else>
			</f:if>
		</li>
	</mmf:post.ifCanMarkSolution>
</ul>
