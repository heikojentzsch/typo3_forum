{namespace mmf=Mittwald\Typo3Forum\ViewHelpers}

<div class="tx-typo3forum-action-menu mb-2">
	<f:if condition="{topic.closed}">
		<button type="button" class="btn btn-dark me-1 mb-1" disabled>
			<i class="fas fa-lock me-1"></i>
			<f:translate key="Button_Closed" />
		</button>
	</f:if>

	<mmf:authentication.ifAccess object="{topic}" accessType="newPost">
		<f:link.action pageUid="{settings.pids.Forum}" pluginName="Forum" controller="Post" action="new" class="btn btn-primary me-1 mb-1" arguments="{topic: topic}">
			<i class="fas fa-reply me-1"></i>
			<f:translate key="Button_Reply" />
		</f:link.action>
	</mmf:authentication.ifAccess>

	<mmf:authentication.ifLoggedIn>
		<f:if condition="!{topic.closed}">
			<mmf:user.ifSubscribed object="{topic}">
				<f:then>
					<f:form pageUid="{settings.pids.Forum}" pluginName="Forum" controller="User" action="subscribe" arguments="{topic: topic.uid, unsubscribe: 1}" method="post" requestToken="typo3_forum/mutation" class="d-inline"><button type="submit" class="btn btn-primary me-1 mb-1">
						<i class="fas fa-bell-slash me-1"></i>
						<f:translate key="Button_Unsubscribe" />
					</button></f:form>
				</f:then>
				<f:else>
					<f:form pageUid="{settings.pids.Forum}" pluginName="Forum" controller="User" action="subscribe" arguments="{topic: topic.uid, unsubscribe: 0}" method="post" requestToken="typo3_forum/mutation" class="d-inline"><button type="submit" class="btn btn-primary me-1 mb-1">
						<i class="fas fa-bell me-1"></i>
						<f:translate key="Button_Subscribe" />
					</button></f:form>
				</f:else>
			</mmf:user.ifSubscribed>
		</f:if>
	</mmf:authentication.ifLoggedIn>

	<mmf:authentication.ifAccess object="{topic}" accessType="moderate">
		<f:link.action pageUid="{settings.pids.Forum}" pluginName="Forum" controller="Moderation" class="btn btn-warning me-1 mb-1" action="editTopic" arguments="{topic: topic}">
			<i class="fas fa-cog me-1"></i>
			<f:translate key="Button_Moderate" />
		</f:link.action>
	</mmf:authentication.ifAccess>
	<mmf:authentication.ifAccess object="{topic}" accessType="deleteTopic">
		<f:link.action pageUid="{settings.pids.Forum}" pluginName="Forum" controller="Moderation" class="btn btn-danger me-1 mb-1" action="confirmDeleteTopic" arguments="{topic: topic}">
			<i class="fas fa-trash-alt me-1"></i>
			<f:translate key="Button_Delete_Topic"/>
		</f:link.action>
	</mmf:authentication.ifAccess>
</div>

<f:link.action pageUid="{settings.pids.Forum}" pluginName="Forum" controller="Forum" action="show" class="btn btn-info" arguments="{forum: topic.forum}">
	<i class="fas fa-chevron-left me-1"></i>
	<f:translate key="Button_Back" />
</f:link.action>
