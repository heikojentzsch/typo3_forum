{namespace mmf=Mittwald\Typo3Forum\ViewHelpers}
{namespace b=Mittwald\Typo3Forum\ViewHelpers\Bootstrap}
<f:layout name="default" />



<f:section name="main">
	<f:render partial="FormErrors" />
	<h2>
		<f:translate key="Report_NewPostReport_Header"/>
	</h2>
	<f:form name="firstComment" object="{firstComment}" controller="Report" action="createUserReport" id="report">
		<div class="row mt-4">
			<div class="col-12">
				<f:render partial="User/InformationRow" arguments="{user: user}" />
			</div>
		</div>

		<div class="card">
			<div class="card-header">
				<h2>
					<f:translate key="Report_New_Reason"/>
				</h2>
			</div>
			<div class="card-body">
				<div class="form-group">
					<f:form.textarea class="form-control" property="text" id="editor" rows="7" cols="80" />

				</div>
				<div class="form-actions mt-4">
					<f:link.action controller="User" pluginName="UserProfile" pageUid="{settings.pids.UserShow}" action="show" class="btn btn-info" arguments="{user: user}">
						<i class="fas fa-chevron-left me-1"></i>
						<f:translate key="Button_Back" />
					</f:link.action>
					<f:form.hidden name="user" value="{user}" />
					<f:form.submit value="{f:translate(key:'Report_New_Submit')}" class="btn btn-primary" />
				</div>
			</div>
		</div>
	</f:form>
</f:section>

<f:section name="menu" />
